<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0647c7" />
    <title>오프라인 | 전국창업모아</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f8fc;
        color: #111827;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
          Arial, sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      section {
        width: min(100%, 390px);
        border-radius: 28px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      }

      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        border-radius: 22px;
        background: #0647c7;
        color: #ffffff;
        font-size: 16px;
        font-weight: 900;
        line-height: 1.05;
        text-align: center;
      }

      h1 {
        margin: 24px 0 0;
        font-size: 30px;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 0;
        color: #64748b;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        border-radius: 16px;
        background: #0b66e4;
        color: #ffffff;
        font-size: 15px;
        font-weight: 900;
        padding: 0 18px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="mark">전국<br />창업모아</div>
        <h1>연결을 확인하고 있어요</h1>
        <p>
          네트워크가 불안정해서 최신 창업 정보와 커뮤니티를 불러오지 못했습니다.
          연결 후 다시 시도해 주세요.
        </p>
        <a href="/">홈으로 돌아가기</a>
      </section>
    </main>
  </body>
</html>
